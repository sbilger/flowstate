services:
  postgres:
    image: postgres:16-alpine
    container_name: flowstate-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowstate}
      POSTGRES_USER: ${POSTGRES_USER:-flowstate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowstate}
    ports:
      - "5432:5432"
    volumes:
      - flowstate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowstate}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flowstate-pgdata:
